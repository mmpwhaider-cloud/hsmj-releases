<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="الدعم وسياسة الخصوصية لتطبيق حسابي Hisabe.">
  <title>حسابي Hisabe | الدعم والخصوصية</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #1e3a8a;
      --accent: #0d9488;
      --text: #1f2937;
      --muted: #4b5563;
      --page: #f8fafc;
      --card: #fff;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: var(--page);
      color: var(--text);
      font: 16px/1.85 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    main {
      width: min(100%, 780px);
      margin: 0 auto;
      padding: clamp(24px, 6vw, 48px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 8px 30px #0f172a0d;
    }
    .badge {
      display: inline-block;
      padding: 3px 13px;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      background: #eff6ff;
      color: var(--primary);
      font-size: .9rem;
      font-weight: 700;
    }
    h1 { margin: 14px 0 8px; color: var(--primary); font-size: clamp(1.7rem, 5vw, 2.3rem); }
    p { margin: 8px 0 20px; color: var(--muted); }
    nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-top: 28px; }
    a.card {
      display: block;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }
    a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; }
    a.card span { display: block; margin-top: 5px; color: var(--muted); font-size: .92rem; font-weight: 400; }
    footer { margin-top: 30px; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <span class="badge">حسابي Hisabe</span>
    <h1>أهلاً بك في حسابي Hisabe</h1>
    <p>تطبيق عربي يساعد شخصين على تنظيم سجل المصروفات والديون المشتركة بوضوح.</p>
    <nav aria-label="روابط التطبيق">
      <a class="card" href="support.html">الدعم والتواصل<span>تواصل معنا عند الحاجة إلى مساعدة.</span></a>
      <a class="card" href="privacy.html">سياسة الخصوصية<span>تعرف على البيانات التي يستخدمها التطبيق وكيفية التعامل معها.</span></a>
    </nav>
    <footer>© 2026 حسابي Hisabe</footer>
  </main>
</body>
</html>
